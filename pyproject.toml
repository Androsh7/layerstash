[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docker_archiver"
version = "0.1.0"
description = "Tools for archiving files to docker hub"
requires-python = ">=3.13"
dependencies = [
    "attrs",
    "loguru",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "nuitka",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 120
select = [
    "E", # Pycodestyle errors
    "F", # Pyflakes
    "I", # Isort
    "PL", # Pylint
    "UP", # Pyupgrade
]

[tool.pylint.format]
max-line-length = 120

[tool.setuptools]
packages = ["docker_archiver"]